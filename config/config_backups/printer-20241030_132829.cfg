########################################
# Serial Connection
########################################

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: arduino

[mcu mks2]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port1
is_non_critical: True
restart_method: arduino

[danger_options]
temp_ignore_limits: True

########################################
# Storage
########################################

[virtual_sdcard]
path: ~/gcode_files
on_error_gcode: CANCEL_PRINT

########################################
# Kinematics
########################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 1500
max_z_velocity: 15
max_z_accel: 500
square_corner_velocity: 10.0

[stepper_x]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 32
endstop_pin:^PE5 #X-Min, PE4:X-Max
position_endstop: -15
position_min: -15
position_max: 360

homing_speed: 30

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 32
endstop_pin: ^PJ0 #^PJ1  #Y-Min, PJ0:Y-Max
position_endstop: 400
position_max: 400
position_min: 0
homing_speed: 30

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 8
rotation_distance: 4
endstop_pin: ^PD2 #^PD3  #Z-Min, PD2:Z-Max
position_endstop: 395
position_max: 395
position_min: -4
homing_speed: 10

########################################
# Toolhead
########################################

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK7
min_temp: 0
max_temp: 300
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[fan]
pin: PH6

[servo extruder_servo]
pin: PC5

[extruder1]
step_pin: PC1
dir_pin: !PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PH4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
min_temp: 0
max_temp: 300
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[extruder_stepper side]
extruder: extruder1
step_pin: mks2:PC1
dir_pin: !mks2:PC3
enable_pin: !mks2:PC7
microsteps: 16
rotation_distance: 20

########################################
# Heater Bed
########################################

[heater_bed]
heater_pin: PH5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK6
min_temp: 0
max_temp: 140
control: pid
pid_Kp: 325.10
pid_Ki: 63.35
pid_Kd: 417.10

########################################
# AutoBedLevel ABL
########################################

[gcode_macro G29]
gcode:
    T0
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=mesh1
    SAVE_CONFIG NO_RESTART=1
    BED_MESH_PROFILE LOAD=mesh1

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_min:20,20
mesh_max: 340,380
probe_count: 4,4

[probe]
pin: ^PE3 #^PD3 #^PD2
z_offset: 0.2
speed: 4.0
samples: 2
sample_retract_dist: 2.0
lift_speed: 10.0
samples_result: median
samples_tolerance: 0.10
samples_tolerance_retries: 10

########################################
# Gcode Routines
########################################

[pause_resume]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

[gcode_macro T0]
gcode:
    G90
    G1 Z15 F100
    SET_SERVO SERVO=extruder_servo angle=0      # Lift secondary extruder
    SET_GCODE_OFFSET Z=0 MOVE=1                 # Adjust z-height
    SET_GCODE_OFFSET X=36                        # Clear X offset
    SET_GCODE_OFFSET X=-5 
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
gcode:
    G1 Z15 F100
    SET_GCODE_OFFSET Z=0.100 MOVE=1             # Adjust z-height
    SET_SERVO SERVO=extruder_servo angle=180    # Position second extruder
    SET_GCODE_OFFSET X=-36                       # Account for different X offset
    SET_GCODE_OFFSET Y=5 
    ACTIVATE_EXTRUDER EXTRUDER=extruder1

########################################
# Misc.
########################################

[display_status]

[force_move]
enable_force_move: True

[save_variables]
filename: /home/pi/variables.cfg

[idle_timeout]
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}  #if its idle because its paused
        {% if printer.extruder.temperature|float >= 150 %}
            M104 T0 S150
        {% endif %}
        {% if printer.extruder1.temperature|float >= 150 %}
            M104 T1 S150
        {% endif %}
    {% else %}  #Any other case
        M107                     ;Fans off
        M104 T0 S0                ;left extruder heater off
        M104 T1 S0                ;right extruder heater off
        M140 S0                  ;heated bed heater off
        M84                      ;steppers off
    {% endif %}
timeout: 2400

[gcode_macro M500]
gcode:
    SAVE_CONFIG NO_RESTART=1

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC0, EXP1_3=PH0, EXP1_5=PA1, EXP1_7=PA5, EXP1_9=<GND>,
    EXP1_2=PC2, EXP1_4=PH1, EXP1_6=PA3, EXP1_8=PA7, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB3, EXP2_3=PC6, EXP2_5=PC4, EXP2_7=PL0,  EXP2_9=<GND>,
    EXP2_2=PB1, EXP2_4=PB0, EXP2_6=PB2, EXP2_8=PG0, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp1"
# See the MKS Lcd Config path file for definitions of common LCD displays.
# [include mks_lcd_12864.cfg]

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_x]
uart_pin: PK1
interpolate: True
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PK2
interpolate: True
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PK3
interpolate: True
run_current: 1.5
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PK4
interpolate: True
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 extruder1]
uart_pin: PB6
interpolate: True
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
